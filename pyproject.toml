[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web2mcp-local"
version = "0.4.0"
authors = [{ name = "xuexying" }]
readme = "README.md"
description = "Observed browser requests to local Python clients and MCP tools"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "mcp>=1.20,<2", "jsonschema>=4,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
web2mcp = "web2mcp.cli:main"

[tool.setuptools.package-data]
web2mcp = ["*.mjs", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
