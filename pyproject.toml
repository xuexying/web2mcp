[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "web2mcp"
dynamic = ["version"]
authors = [{ name = "xueying" }]
readme = "README.md"
description = "Record a web app once in your browser, get MCP tools that call it over HTTP. Read-only by default."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=1.20,<2",
    "jsonschema>=4,<5",
    "filelock>=3.13,<5",
]
keywords = ["mcp", "model-context-protocol", "har", "openapi", "api-discovery", "ai-agents", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/xuexying/web2mcp"
Issues = "https://github.com/xuexying/web2mcp/issues"

[project.optional-dependencies]
test = ["pytest>=8,<9"]
dev = ["pytest>=8,<9", "ruff>=0.8"]

[project.scripts]
web2mcp = "web2mcp.cli:main"

[tool.setuptools.dynamic]
version = { attr = "web2mcp.__version__" }

[tool.setuptools.packages.find]
include = ["web2mcp*"]

[tool.setuptools.package-data]
web2mcp = ["*.mjs", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are imported for their side effect and used by parameter name.
"tests/*" = ["F401", "F811"]
